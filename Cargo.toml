[workspace]
members = ["crates/oojuro", "crates/oojuro-capture", "crates/oojuro-proxy"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/oojuro/o-journal"

[workspace.dependencies]
ojo = { git = "https://github.com/oojuro/oojuro.git", rev = "3257ae871ff63e39521f39ffc5c3742299fd2c4d", features = ["archive"] }
oojuro-core = { git = "https://github.com/oojuro/oojuro.git", rev = "3257ae871ff63e39521f39ffc5c3742299fd2c4d" }
oojuro-engine = { git = "https://github.com/oojuro/oojuro.git", rev = "3257ae871ff63e39521f39ffc5c3742299fd2c4d" }
oojuro-nine = { git = "https://github.com/oojuro/oojuro.git", rev = "3257ae871ff63e39521f39ffc5c3742299fd2c4d" }
oojuro-store = { git = "https://github.com/oojuro/oojuro.git", rev = "3257ae871ff63e39521f39ffc5c3742299fd2c4d" }
oojuro-trace = { git = "https://github.com/oojuro/oojuro.git", rev = "3257ae871ff63e39521f39ffc5c3742299fd2c4d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
crc32fast = "1"

[profile.dev]
debug = 0

[profile.test]
debug = 0
