[package]
name = "oojuro"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Oojuro v1 front door: the journal used like SQLite (library API, `oojuro` CLI, MCP server, settings) and the `oojurod` recorder that serves it to other processes"

[[bin]]
name = "ojo-journal"
path = "src/bin/ojo-journal.rs"

[[bin]]
name = "oojuro"
path = "src/bin/oojuro.rs"

[[bin]]
name = "oojurod"
path = "src/bin/oojurod.rs"

[[bin]]
name = "oojuro-native"
path = "src/bin/oojuro-native.rs"

[dependencies]
ojo.workspace = true
base64 = "0.22"
oojuro-engine = { workspace = true }
blake3.workspace = true
oojuro-capture = { path = "../oojuro-capture" }
oojuro-proxy = { path = "../oojuro-proxy" }
oojuro-trace = { workspace = true }
oojuro-nine = { workspace = true }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
toml = "0.9"
regex = "1"
jiff = "0.2"
aho-corasick = "1"
libc = "0.2"
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
flate2 = "1"

[dev-dependencies]
toml = "0.9"
